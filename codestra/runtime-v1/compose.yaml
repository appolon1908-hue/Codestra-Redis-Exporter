name: codestra-redis-exporter

services:
  redis-exporter:
    image: docker.io/oliver006/redis_exporter@sha256:a129504e65b87c54f79bc92f1afc403475e8ff646a3d7512de469904ceddf986
    restart: unless-stopped
    user: "59000:59000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - --redis.addr=${REDIS_ADDR:?set one private redis or rediss address with an explicit port and without credentials}
      - --redis.user=${REDIS_MONITOR_USER:-codestra_monitor}
      - --redis.password-file=/run/secrets/redis_password_map.json
      - --web.listen-address=0.0.0.0:9121
      - --web.telemetry-path=/metrics
      - --disable-scrape-endpoint
      - --namespace=redis
      - --config-command=-
      - --export-client-list=false
      - --export-client-port=false
      - --disable-exporting-key-values=true
      - --skip-tls-verification=false
    labels:
      com.codestra.business: ${CODESTRA_BUSINESS:?use an approved business slug}
      com.codestra.application: ${CODESTRA_APPLICATION:?set application}
      com.codestra.service: redis-exporter
      com.codestra.environment: ${CODESTRA_ENVIRONMENT:?set environment}
      com.codestra.deployment: ${CODESTRA_DEPLOYMENT:?set immutable deployment identifier}
      com.codestra.owner: platform-observability
      com.codestra.secret-file-owner: "59000:59000"
      com.codestra.secret-file-mode: "0400"
    volumes:
      - type: bind
        source: ${REDIS_MONITOR_PASSWORD_MAP_FILE:?mount an OpenBao-rendered file owned by 59000:59000 with mode 0400}
        target: /run/secrets/redis_password_map.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - codestra_data
      - codestra_observability
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

networks:
  codestra_data:
    external: true
    name: codestra-data
  codestra_observability:
    external: true
    name: codestra-observability
