name: Validate Codestra enterprise profile
on:
  pull_request:
    paths: ['codestra/**','scripts/validate_codestra_enterprise_profile.py']
  push:
    branches: [main, staging, production]
    paths: ['codestra/**','scripts/validate_codestra_enterprise_profile.py']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 scripts/validate_codestra_enterprise_profile.py
