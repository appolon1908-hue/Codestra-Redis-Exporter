name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: redis-exporter-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-Redis-Exporter', '37.27.128.39', '65.109.65.169',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', 'GET` | `/metrics',
              'exactly one exporter instance for exactly one approved Redis target',
              'EXACTLY_ONE_EXPORTER_PER_REDIS_INSTANCE=PASS',
              'EXACTLY_ONE_CONFIGURED_REDIS_TARGET=PASS',
              'PASSWORD_MAP_KEY_EQUALS_CONFIGURED_URI=PASS',
              'PASSWORD_MAP_KEYS=EXACTLY_ONE_CONFIGURED_URI',
              'GET_/scrape_ARBITRARY_TARGET=DENIED', 'MULTI_TARGET_MODE=DISABLED',
              'READ_ONLY_REDIS_IDENTITY=PASS', 'KEY_VALUE_EXPORT=NO',
              'CREDENTIALS_EXPOSED=0', 'UNEXPECTED_404=0',
              'SOURCE_RUNTIME_DRIFT=0', 'This document does not deploy Redis Exporter',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'or an equally strict source-controlled target allowlist',
              'allowlisted multi-target candidate',
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden or unsupported production contract claims: {present}'
          print('CODESTRA_REDIS_EXPORTER_PRODUCTION_API_CONTRACT=PASS')
          PY
